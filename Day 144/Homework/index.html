<!-- 1) TailwindCSS გამოიყენება სწრაფი და მარტივი სტილიზაციისთვის, პირდაპირ HTML კლასებში, არ საჭიროებს ცალკე CSS ფაილს. -->

<!-- 2) გაკვეთილზე ნასწავლი ძირითადი კლასები და მათი ფუნქციები: -->
<!-- flex, flex-wrap → ელემენტების გალაგება ფლექს კონტეინერში და სრუალად გადატანა ახალ ხაზზე -->
<!-- justify-between / justify-end → ელემენტების ჰორიზონტალური განლაგება -->
<!-- items-center / self-start / self-end → ვერტიკალური განლაგება flex კონტეინერში -->
<!-- w-1/2, h-1/3 → სიგანე/სიმაღლე პროცენტებში -->
<!-- p-12, px-10, py-3 → padding (შიდა სივრცე) -->
<!-- border-b-4, border-double, border-[color] → საზღვრები და სტილები -->
<!-- rounded-full → ელემენტის მრგვალი კუთხეები -->
<!-- text-transparent + bg-clip-text → ტექსტის ფერის ჩაჭრა gradient-ზე -->
<!-- responsive კლასი sm:, md:, lg: → სხვადასხვა ზომის ეკრანებზე სტილის მიცემა -->
<!-- space-x-6 → ელემენტებს შორის ჰორიზონტალური სივრცე -->
<!-- dark:bg-... / dark:text-... → Dark mode სტილები -->
<!-- hover:bg-... → ელემენტის ფერის შეცვლა hover-ზე -->

<!-- 3) Navbar -->
<div class="flex justify-between items-center p-4 bg-gray-100">
  <div class="font-bold">Logo</div>
  <div class="space-x-4">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
  <button class="px-4 py-2 bg-blue-500 text-white rounded">Button</button>
</div>

<!-- 4) Flex-wrap ბოქსები -->
<div class="flex flex-wrap gap-4 mt-4">
  <div class="w-40 h-40 bg-red-200"></div>
  <div class="w-40 h-40 bg-green-200"></div>
  <div class="w-40 h-40 bg-blue-200"></div>
  <div class="w-40 h-40 bg-yellow-200"></div>
</div>

<!-- 5) -->
<div class="flex gap-4 mt-4">
  <div class="flex-[2] bg-purple-200 h-20"></div>
  <div class="flex-[1] bg-pink-200 h-20"></div>
  <div class="flex-[1] bg-indigo-200 h-20"></div>
</div>

<!-- 6) -->
<div class="flex justify-end gap-4 mt-4">
  <div class="self-start bg-red-300 w-20 h-20"></div>
  <div class="bg-green-300 w-20 h-20"></div>
  <div class="bg-blue-300 w-20 h-20"></div>
</div>

<!-- 7)  -->
<div class="flex flex-col items-center gap-4 mt-4 h-64">
  <div class="self-end bg-red-200 w-20 h-20"></div>
  <div class="bg-green-200 w-20 h-20"></div>
  <div class="self-start bg-blue-200 w-20 h-20"></div>
</div>

<!-- 8) r -->
<div class="border-b-4 border-red-500 w-40 mt-4"></div>

<!-- 9) -->
<div class="border-8 border-double border-black w-40 h-20 mt-4"></div>

<!-- 10) -->
<div class="rounded-full w-20 h-20 bg-purple-400 mt-4"></div>

<!-- 11)-->
<h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-yellow-500 mt-4">
  Gradient Text
</h1>

<!-- 12) -->
<p class="sm:text-sm md:text-lg lg:text-2xl mt-4">Responsive Text Example</p>

<!-- 13)-->
<p class="indent-8 mt-4">This is a paragraph with first line indentation using TailwindCSS.</p>
